name: Android release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Windows server to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'release'
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/vpad.jks
          cat > keystore/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build signed release APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleRelease

      - name: Verify APK version matches the tag
        working-directory: android
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          brand=$(sed -n 's/^[[:space:]]*const val VERSION[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' app/src/main/java/com/alamshowkat/lemogamepad/Theme.kt | head -n1)
          if [ "$declared" != "$tag" ]; then
            echo "::error::versionName is '$declared' but the release tag is '$tag'"
            exit 1
          fi
          if [ "$brand" != "$tag" ]; then
            echo "::error::Brand.VERSION is '$brand' but the release tag is '$tag'"
            exit 1
          fi
          echo "versionName $declared and Brand.VERSION $brand match tag $tag"

      - name: Verify Rust binaries match the tag
        working-directory: rust
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          gui=$(sed -n 's/^const APP_VERSION: &str = "\(.*\)";/\1/p' src/gui/main.rs | head -n1)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$gui" != "$tag" ]; then
            echo "::error::GUI version '$gui' does not match release tag '$tag'"
            exit 1
          fi
          # Cargo requires three-part semver: a short 2.2 label is 2.2.0 in the manifest.
          if [ "$cargo_version" != "$tag" ] && [ "$cargo_version" != "$tag.0" ]; then
            echo "::error::Cargo version '$cargo_version' does not match release tag '$tag'"
            exit 1
          fi
          echo "GUI version $gui and Cargo version $cargo_version match tag $tag"

      - name: Attach APK to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="lemoGamePad-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          # Older releases used this generic name; remove it so the release
          # keeps exactly one APK.
          gh release delete-asset "$GITHUB_REF_NAME" app-release.apk --yes || true

  windows-server:
    name: Build and publish Windows server
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Build native Rust receiver and desktop panel
        working-directory: rust
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          New-Item -ItemType Directory -Force -Path ../pc/dist | Out-Null
          Copy-Item target/release/lemoGamePad-server.exe ../pc/dist/lemoGamePad-server.exe -Force
          Copy-Item target/release/lemoGamePad-app.exe ../pc/dist/lemoGamePad-app.exe -Force

      - name: Attach Windows receiver and app to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" pc/dist/lemoGamePad-server.exe pc/dist/lemoGamePad-app.exe pc/allow_firewall.ps1 --clobber

  linux-server:
    name: Build and publish Linux server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Build native Rust receiver and desktop panel
        working-directory: rust
        run: |
          cargo build --release
          mkdir -p ../pc/dist
          cp target/release/lemoGamePad-server ../pc/dist/lemoGamePad-server
          cp target/release/lemoGamePad-app ../pc/dist/lemoGamePad-app

      - name: Attach Linux receiver and app to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" pc/dist/lemoGamePad-server pc/dist/lemoGamePad-app pc/linux/install-linux.sh --clobber

  checksums:
    name: Publish SHA256SUMS.txt
    needs: [release, windows-server, linux-server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out license files
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            LICENSE
            THIRD_PARTY_LICENSES.md
          sparse-checkout-cone-mode: false

      - name: Download release assets, checksum, upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # Publish the license texts next to the binaries they cover.
          gh release upload "$RELEASE_TAG" LICENSE THIRD_PARTY_LICENSES.md --repo "$GH_REPO" --clobber
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir assets --clobber \
            --pattern 'lemoGamePad-*' --pattern 'install-linux.sh' --pattern 'allow_firewall.ps1' \
            --pattern 'LICENSE' --pattern 'THIRD_PARTY_LICENSES.md'
          cd assets

          files=()
          for f in lemoGamePad-server lemoGamePad-server.exe lemoGamePad-app lemoGamePad-app.exe install-linux.sh allow_firewall.ps1 LICENSE THIRD_PARTY_LICENSES.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f"
              exit 1
            fi
            files+=("$f")
          done
          for f in lemoGamePad-*.apk; do
            if [ -e "$f" ]; then
              files+=("$f")
            fi
          done

          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GH_REPO" --clobber
