name: Android release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Windows server to
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'release'
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/vpad.jks
          cat > keystore/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build signed release APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleRelease

      - name: Attach APK to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="lemoGamePad-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          # Older releases used this generic name; remove it so the release
          # keeps exactly one APK.
          gh release delete-asset "$GITHUB_REF_NAME" app-release.apk --yes || true

  windows-server:
    name: Build and publish Windows server
    runs-on: windows-latest
    env:
      # Never let PyInstaller import vgamepad trigger a driver install on the
      # build runner; the driver is only needed at runtime on the user's PC.
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server build dependencies
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone server
        working-directory: pc
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name lemoGamePad-server --collect-all vgamepad --collect-all mss --collect-all PIL --collect-all qrcode --exclude-module linux_pad --exclude-module evdev --distpath dist --workpath build vpad_server.py

      - name: Attach Windows server to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" pc/dist/lemoGamePad-server.exe --clobber

  linux-server:
    name: Build and publish Linux server
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server build dependencies
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone server
        working-directory: pc
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name lemoGamePad-server --hidden-import linux_pad --collect-submodules evdev --collect-all mss --collect-all PIL --collect-all qrcode --distpath dist --workpath build vpad_server.py

      - name: Attach Linux server to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" pc/dist/lemoGamePad-server pc/linux/install-linux.sh --clobber

  checksums:
    name: Publish SHA256SUMS.txt
    needs: [release, windows-server, linux-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets, checksum, upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" --dir assets --clobber \
            --pattern 'lemoGamePad-*' --pattern 'install-linux.sh'
          cd assets

          files=()
          for f in lemoGamePad-server lemoGamePad-server.exe install-linux.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f"
              exit 1
            fi
            files+=("$f")
          done
          for f in lemoGamePad-*.apk; do
            if [ -e "$f" ]; then
              files+=("$f")
            fi
          done

          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
