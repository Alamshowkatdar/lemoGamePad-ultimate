name: PC server tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux virtual pad + protocol
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Enable uinput
        run: |
          sudo modprobe uinput || true
          sudo chmod 666 /dev/uinput || true

      - name: Protocol, slots, rumble routing, reconnect
        working-directory: pc
        run: python test_multi.py

      - name: Virtual pad and force feedback
        working-directory: pc
        run: |
          python test_linux_pad.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::/dev/uinput is unavailable; skipped the virtual pad test"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
