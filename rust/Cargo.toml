[package]
name = "lemoGamePad-server"
version = "2.2.2"
edition = "2021"
description = "Native Rust receiver for lemoGamePad ultimate"
license = "MIT"

[[bin]]
name = "lemoGamePad-server"
path = "src/main.rs"

[[bin]]
name = "lemoGamePad-app"
path = "src/gui/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "clipboard", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
libc = "0.2"
qrcode = "0.14"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
